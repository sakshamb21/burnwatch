[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burnwatch"
version = "0.1.0"
description = "CanSat-Assisted Environmental Incident Investigation System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "click>=8.1,<9",
    "python-dotenv>=1.0,<2",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34,<2",
    "mangum>=0.17,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.3,<1",
    "coverage>=7.4,<8",
]

[project.scripts]
burnwatch = "burnwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/burnwatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/burnwatch/api/static" = "burnwatch/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may use database)",
    "hardware: Tests requiring physical CanSat hardware",
    "aws: Tests requiring AWS credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP042"]

[tool.coverage.run]
source = ["src/burnwatch"]
omit = ["*/aws/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
